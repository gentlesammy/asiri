name: Deploy to EC2

on:
  push:
    branches:
      - auth_aws

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          debug: true
          script: |
            set -e

            echo "🚀 Starting deployment process..."

            cd ${{ secrets.DEPLOY_PATH }} || { echo "❌ Failed to cd into deploy path"; exit 1; }

            echo "📂 Current directory: $(pwd)"
            echo "👤 Current user: $(whoami)"

            echo "🚧 Putting application into maintenance mode..."
            php artisan down || true

            echo "🔄 Fetching latest changes from auth_aws branch..."
            git fetch origin auth_aws

            echo "🔄 Resetting to origin/auth_aws..."
            git reset --hard origin/auth_aws

            echo "📦 Installing/updating Composer dependencies..."
            /usr/local/bin/composer install \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader \
              --no-dev

            echo "🔧 Running database migrations..."
            php artisan migrate --force

            echo "🗑️ Clearing application caches..."
            php artisan optimize:clear || echo "Optimize clear failed (non-fatal)"

            echo "⚡ Caching configuration..."
            php artisan config:cache || echo "Config cache failed (non-fatal)"
            php artisan route:cache || echo "Route cache failed (non-fatal)"
            php artisan view:cache || echo "View cache failed (non-fatal)"
            php artisan event:cache || echo "Event cache failed (non-fatal)"

            echo "🔗 Ensuring storage link exists..."
            php artisan storage:link || echo "Storage link already exists"

            echo "🔐 Setting correct directory permissions..."
            # Adjust 'www-data' if your web server runs as a different user (e.g., 'nginx')
            sudo chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || echo "Ownership change skipped (may require sudo privileges)"
            sudo chmod -R 775 storage bootstrap/cache 2>/dev/null || echo "Permission change skipped"

            echo "👷 Restarting queue workers..."
            php artisan queue:restart || echo "Queue restart failed (non-fatal)"

            echo "🔄 Reloading PHP-FPM to clear OPcache..."
            # Try reloading standard PHP-FPM services; adjust version if your server uses a different PHP version
            sudo systemctl reload php8.4-fpm 2>/dev/null || sudo systemctl reload php-fpm 2>/dev/null || echo "PHP-FPM reload skipped"

            echo "🚀 Bringing application out of maintenance mode..."
            php artisan up || true

            echo "✅ Deployment completed successfully!"
