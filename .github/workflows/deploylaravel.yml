name: Deploy to EC2

on:
  push:
    branches:
      - auth_aws  

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, bcmath, curl, mysql, zip, gd, intl, redis
          coverage: none

      # - name: Copy .env file
      #   run: |
      #     echo "${{ secrets.APP_ENV_FILE }}" > .env
      #   if: secrets.APP_ENV_FILE != ''

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader --no-dev

      # - name: Generate application key
      #   run: php artisan key:generate --ansi
      #   if: secrets.APP_ENV_FILE != ''

      # - name: Run tests
      #   run: php artisan test

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            
            echo "🔄 Pulling latest changes..."
            git pull origin main
            
            echo "📦 Installing/updating dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            
            echo "🔧 Running database migrations..."
            php artisan migrate --force
            
            echo "🗑️  Clearing caches..."
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            
            echo "⚡ Optimizing application..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            
            echo "👷 Restarting queue workers..."
            php artisan queue:restart
            
            echo "✅ Deployment completed successfully!"

      - name: Notify on success
        if: success()
        run: echo "🎉 Deployment to production was successful!"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed. Please check the logs."