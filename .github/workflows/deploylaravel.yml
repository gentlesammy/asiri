name: Deploy to EC2

on:
  push:
    branches:
      - auth_aws

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, bcmath, curl, mysql, zip, gd, intl, redis
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader --no-dev

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          debug: true
          script: |
            set -e

            echo "🚀 Starting deployment process..."

            cd ${{ secrets.DEPLOY_PATH }} || { echo "❌ Failed to cd into deploy path"; exit 1; }

            echo "📂 Current directory: $(pwd)"
            echo "👤 Current user: $(whoami)"

            echo "🔄 Fetching latest changes from auth_aws branch..."
            git fetch origin auth_aws

            echo "🔄 Resetting to origin/auth_aws..."
            git reset --hard origin/auth_aws

            echo "📦 Installing/updating Composer dependencies..."
            /usr/local/bin/composer install \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader \
              --no-dev

            echo "🔧 Running database migrations..."
            php artisan migrate --force

            echo "🗑️ Clearing application caches..."
            php artisan optimize:clear || echo "Optimize clear failed (non-fatal)"

            echo "⚡ Caching configuration..."
            php artisan config:cache || echo "Config cache failed (non-fatal)"
            php artisan route:cache || echo "Route cache failed (non-fatal)"
            php artisan view:cache || echo "View cache failed (non-fatal)"
            php artisan event:cache || echo "Event cache failed (non-fatal)"

            echo "🔗 Ensuring storage link exists..."
            php artisan storage:link || echo "Storage link already exists"

            echo "👷 Restarting queue workers..."
            php artisan queue:restart || echo "Queue restart failed (non-fatal)"

            echo "✅ Deployment completed successfully!"
